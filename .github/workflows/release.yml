name: Build

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  PRODUCT_NAME: ImageCaptureCore
  XCODE_PROJECT: ImageCaptureCore.xcodeproj
  MACOS_DEPLOYMENT_TARGET: '11.0'

concurrency:
  group: ica-publication
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: source version and early publication availability
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(python3 .github/scripts/publication.py check --sha "$GITHUB_SHA")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  build-macos:
    name: Build macOS, package, sign, notarize & release
    needs: [version]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: recheck source and availability before credentials
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          VERSION=$(python3 .github/scripts/publication.py check --sha "$GITHUB_SHA")
          test "$VERSION" = "$EXPECTED_VERSION"

      - name: import Developer ID certificate
        env:
          CERT_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE }}
          CERT_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo "KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"

      - name: store notarytool credentials
        env:
          APPLE_ID: ${{ secrets.NOTARYTOOL_APPLE_ID }}
          TEAM_ID: ${{ secrets.NOTARYTOOL_TEAM_ID }}
          APP_PASSWORD: ${{ secrets.NOTARYTOOL_PASSWORD }}
        run: |
          set -euo pipefail
          xcrun notarytool store-credentials "notarytool-profile" \
            --apple-id "$APPLE_ID" \
            --team-id "$TEAM_ID" \
            --password "$APP_PASSWORD" \
            --keychain "$KEYCHAIN_PATH"

      - name: build macOS (universal)
        run: |
          set -euo pipefail
          python3 .github/scripts/native.py cleanup --sha "$GITHUB_SHA"
          xcodebuild -project "$XCODE_PROJECT" \
            -target "$PRODUCT_NAME" \
            -configuration Default \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET="$MACOS_DEPLOYMENT_TARGET" \
            build

      - name: verify universal binary
        run: |
          set -euo pipefail
          BUNDLE_PATH="test/Plugins/$PRODUCT_NAME.bundle"
          BIN="$BUNDLE_PATH/Contents/MacOS/$PRODUCT_NAME"
          python3 .github/scripts/native.py unsigned --sha "$GITHUB_SHA"
          lipo -info "$BIN"
          python3 .github/scripts/native.py architectures --sha "$GITHUB_SHA"
          echo "BUNDLE_PATH=$BUNDLE_PATH" >> "$GITHUB_ENV"

      - name: codesign
        run: |
          set -euo pipefail
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | sed -E 's/.*"(.*)".*/\1/')
          test -n "$IDENTITY"
          codesign --verbose --deep --timestamp --force --options=runtime \
            --sign "$IDENTITY" "$BUNDLE_PATH"
          codesign --verify --deep --strict --verbose=2 "$BUNDLE_PATH"

      - name: package, notarize & staple
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ZIP_PATH="$PRODUCT_NAME-$VERSION.zip"
          DMG_PATH="$PRODUCT_NAME-$VERSION.dmg"
          ditto -c -k --keepParent "$BUNDLE_PATH" "$ZIP_PATH"
          hdiutil create -format UDBZ -volname "$PRODUCT_NAME" -srcfolder "$BUNDLE_PATH" "$DMG_PATH"
          python3 .github/scripts/notarize.py --keychain "$KEYCHAIN_PATH"

      - name: create-only final publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 .github/scripts/publication.py publish --sha "$GITHUB_SHA"
