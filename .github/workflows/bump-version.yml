name: Bump version

on:
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        description: Semantic version bump
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency:
  group: ica-publication
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - name: checkout immutable source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: guarded source-only version child
        env:
          BUMP_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          python3 .github/scripts/bump.py "$BUMP_MODE" --sha "$GITHUB_SHA" --ref "$GITHUB_REF"
